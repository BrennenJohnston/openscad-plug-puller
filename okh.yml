licensor:
  name: Brennen Johnston
documentation-language: en-US
date-created: 2026-07-22
date-updated: 2026-10-27
function: |
  A handheld 3D-printed tool for pulling an electrical plug out of an outlet with the whole
  hand instead of a fingertip pinch, for anyone with arthritis, low grip strength, tremor,
  a small hand or one hand. Two finger holes take the pull; the tool grips only the plug's
  sides and back, never the outlet, and stays on its plug. It is parametric: pick a measured
  plug preset or type the plug's and the hand's measurements into the OpenSCAD Customizer
  form, and the tool is shaped to them. The tool is chosen by counting the plug's prongs: a
  plug with 2 prongs or a USB-C tip gets the one-sided puller, a single printed part with a
  plug pocket, two finger holes and a cord hook; a plug with 3 prongs, or any plug 24 mm
  thick or more, gets the two-sided puller, two identical toothed plates that zip-tie face
  to face around the plug. Each tool is its own file. A red tag printed beside the part
  reports a measurement that cannot work. Ready-to-print STLs cover every preset at three
  hand sizes, a one-page plug size finder matches a plug to its preset at true size, and a
  printable measuring stencil finds the numbers by matching shapes.

