# Open Know-How (OKH) manifest for the Plug Puller
# Follows the Open Know-How Specification (Internet of Production Alliance, 2022)
# Spec: https://standards.internetofproduction.org/pub/okh
# Field set copied from the Click Me access switch's manifest, with this model's own paths.

okhv: OKH-LOSHv1.0

name: "Plug Puller: parametric assistive plug remover"
repo: https://github.com/BrennenJohnston/openscad-plug-puller
version: 0.12.0
license:
  hardware: PolyForm-Noncommercial-1.0.0
  documentation: PolyForm-Noncommercial-1.0.0
  software: PolyForm-Noncommercial-1.0.0
licensor:
  name: Brennen Johnston
documentation-language: en-US
date-created: 2026-07-22
date-updated: 2026-09-26
function: |
  A handheld 3D-printed tool for pulling an electrical plug out of a wall outlet with a whole
  hand instead of a fingertip pinch, for anyone with arthritis, low grip strength, tremor,
  a small hand or one hand. Two finger holes take the pull; the tool grips only the plug's
  sides and back, never the outlet. It is parametric: type a few ruler measurements of your
  plug and your hand into the OpenSCAD Customizer form, or pick a measured plug preset, and
  the tool is shaped to them. A plug up to 24 mm thick gets the one-sided puller, a single
  printed part with a plug pocket, two finger holes and a cord hook; a thicker plug, a USB-C
  tip or a round cord plug gets the two-sided puller, two identical plates that zip-tie
  face to face around the plug. A red tag printed beside the part reports a measurement
  that cannot work. Ready-to-print STLs cover the common US plug families at three hand
  sizes, and a printable measuring stencil finds the numbers by matching shapes.

documentation-readiness-level: ODRL-3
technology-readiness-level: OTRL-4

documentation-home: https://github.com/BrennenJohnston/openscad-plug-puller#readme
archive-download: https://github.com/BrennenJohnston/openscad-plug-puller/releases

