<svg xmlns="http://www.w3.org/2000/svg" width="223.00mm" height="47.17mm" viewBox="0 0 223.00 47.17" role="img">
<title>Plug thickness at the prong end</title>
<desc>Two vertical slices of the one-sided puller at x = 0 mm, before left and after right, the top face up. Left: the defaults, the plug in teal in the cut. Right: plug thickness at the prong end at 23.5 mm: deepens or shallows the two pocket floors, the round seat and the plug recess, to suit the fatter of the two thickness numbers. The red line marks the plug's thickness at the prong end and reads 23.5 mm, the number you type. Marked in red: 1, the seat and the pocket: the round recess at the plug end; the plug recess on the centerline.</desc>
