<svg xmlns="http://www.w3.org/2000/svg" width="148.00mm" height="46.90mm" viewBox="0 0 148.00 46.90" role="img">
<title>Zip-tie pair 2 position</title>
<desc>Two top views of the one-sided puller, before left and after right, the plug end at the top. Left: the defaults with zip-tie hole placement set to Manual, a 25 mm wide plug in teal. Right: zip-tie pair 2 position at 26 mm: slides the second pair of zip-tie holes along the plug's side, measured from the plug end. Marked in red: 1, the zip-tie holes: the four small holes beside the pocket. 2, the wing openings: the two openings beside the pocket.</desc>
