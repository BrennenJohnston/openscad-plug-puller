<svg xmlns="http://www.w3.org/2000/svg" width="201.26mm" height="75.50mm" viewBox="0 0 201.26 75.50" role="img">
<title>Finger holes on or off</title>
<desc>Two top views of the one-sided puller, before left and after right, the plug end at the top. Left: the defaults with hand size set to Custom, a 25 mm wide plug in teal. Right: finger holes on or off set to false: cuts or leaves out both finger holes. Marked in red: 1, the finger holes and the body edge: the two large holes in the lower half; the outer outline, removed. Everything else follows the outline.</desc>
