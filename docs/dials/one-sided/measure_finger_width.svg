<svg xmlns="http://www.w3.org/2000/svg" width="83.52mm" height="108.14mm" viewBox="0 0 83.52 108.14" role="img">
<title>Finger width</title>
<desc>Widens both finger holes, spaces them farther apart and pushes them and the body up to keep the walls printable. Before: 20. After: 26.</desc>
