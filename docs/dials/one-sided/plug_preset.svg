<svg xmlns="http://www.w3.org/2000/svg" width="86.80mm" height="128.61mm" viewBox="0 0 86.80 128.61" role="img">
<title>Plug preset</title>
<desc>Fills in all six plug numbers from a measured reference plug, so the pocket, the wall notch, the cord hook and the zip-tie and wing positions all take that plug's shape at once. Before: Measure my plug. After: Standard 3-prong plug - NEMA 5-15.</desc>
