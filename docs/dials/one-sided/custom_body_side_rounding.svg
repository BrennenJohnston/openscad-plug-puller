<svg xmlns="http://www.w3.org/2000/svg" width="216.28mm" height="75.50mm" viewBox="0 0 216.28 75.50" role="img">
<title>Body side rounding</title>
<desc>Two top views of the one-sided puller, before left and after right, the plug end at the top. Left: the defaults with hand size set to Custom, a 25 mm wide plug in teal. Right: body side rounding at 5 mm: rounds the body outline's corners more or less, down to the plain octagon at 0. Marked in red: 1, the body edge: the outer outline. Everything else follows the outline.</desc>
