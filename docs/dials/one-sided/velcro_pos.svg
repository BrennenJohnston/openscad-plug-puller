<title>Strap slot position</title>
<desc>Two top views of the one-sided puller, before left and after right, the plug end at the top. Left: the defaults with strap opening style set to Classic slot and strap slot placement set to Manual, a 25 mm wide plug in teal. Right: strap slot position at 25 mm: slides the pair of strap slots along the plug's side, measured from the plug end. Marked in red: 1, the classic slots: the two slots beside the pocket.</desc>
