<text x="37.75" y="13.90" font-family="Helvetica, Arial, sans-serif" font-size="3.40" text-anchor="middle" fill="#000">(size: Custom, section-x: 0)</text>
<path d="M 6.00 20.75 L 31.50 20.75 L 31.50 40.75 L 6.00 40.75 L 6.00 20.75 Z" fill="#20b2aa" fill-rule="evenodd" fill-opacity="0.45" stroke="none"/>
