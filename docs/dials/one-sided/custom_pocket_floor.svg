<svg xmlns="http://www.w3.org/2000/svg" width="75.50mm" height="60.39mm" viewBox="0 0 75.50 60.39" role="img">
<title>Plug recess floor thickness</title>
<desc>Thins or thickens the floor left under the plug recess, so the recess is cut deeper or shallower. Before: 3.81. After: 2.</desc>
