<svg xmlns="http://www.w3.org/2000/svg" width="148.00mm" height="26.90mm" viewBox="0 0 148.00 26.90" role="img">
<title>Tip flare</title>
<desc>Two top views of one plate of the two-sided puller, before left and after right, the plug end at the top. Left: the defaults, a 20 mm wide plug in teal. Right: tip flare at 3 mm: opens the gap wider right at the arm tips so the plug head can enter before the teeth bite. Marked in red: 1, the arms: the two toothed arms in the upper half. 2, the zip stations: the three small holes along each arm.</desc>
