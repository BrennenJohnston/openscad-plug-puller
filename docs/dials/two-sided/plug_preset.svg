<title>Plug preset</title>
<desc>Fills in the plug's length, both widths and the cord from the measured heavy-duty cord plug, so the arms, the grip gap, the cord channel and the plate length all take that plug's shape at once. Before: Measure my plug. After: Heavy-duty extension cord - NEMA 5-15.</desc>
