<svg xmlns="http://www.w3.org/2000/svg" width="82.79mm" height="91.64mm" viewBox="0 0 82.79 91.64" role="img">
<title>Extra wall on the plate</title>
<desc>Thickens every wall around the finger holes, the cord channel, the zip-tie holes and the strap slot at once, so the plate outline grows and the openings shift to keep their walls. Before: 0. After: 2.</desc>
