<svg xmlns="http://www.w3.org/2000/svg" width="168.14mm" height="24.30mm" viewBox="0 0 168.14 24.30" role="img">
<title>Outer edge rounding</title>
<desc>Two vertical slices of the two-sided puller at y = 3 mm, before left and after right, the top face up. Left: the defaults, the plug in teal in the cut. Right: outer edge rounding at 0 mm: rounds or squares the outer face's edge all around the plate, while the plug-contact face stays square. Marked in red: 1, the finger lobes: the two rounded lobes in the lower half. The plate edge, the arms, the teeth and the cord channel stay where they were.</desc>
