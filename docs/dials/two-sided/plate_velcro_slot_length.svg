<title>Strap slot length</title>
<desc>Two top views of one plate of the two-sided puller, before left and after right, the plug end at the top. Left: the defaults with plug length set to 40, a 20 mm wide plug in teal. Right: strap slot length at 15 mm: lengthens or shortens the strap slot along each arm, within the window between the zip-tie stations. Marked in red: 1, the strap slot: the long slot in each arm. 2, the arms: the two toothed arms in the upper half.</desc>
