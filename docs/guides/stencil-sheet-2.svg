<text x="54.000" y="141.500" font-family="Helvetica, Arial, sans-serif" font-size="3.4" font-weight="bold" text-anchor="middle" fill="black">T</text>
<text x="67.500" y="141.500" font-family="Helvetica, Arial, sans-serif" font-size="2.6" font-weight="normal" text-anchor="middle" fill="black">cord</text>
<text x="9.000" y="147.000" font-family="Helvetica, Arial, sans-serif" font-size="4.2" font-weight="bold" text-anchor="start" fill="black">P4</text>
<text x="17.500" y="147.000" font-family="Helvetica, Arial, sans-serif" font-size="2.6" font-weight="normal" text-anchor="start" fill="#444444">Wide 2-prong NEMA 1-15</text>
<text x="105.000" y="274.500" font-family="Helvetica, Arial, sans-serif" font-size="2.4" font-weight="normal" text-anchor="middle" fill="#444444">openscad-plug-puller · measuring stencil sheet · scale 1:1 · prefer plastic? print stl/Measuring-Stencil/ · page 2 of 2</text>
